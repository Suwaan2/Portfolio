<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#81ecff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#70aaff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0e0e0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#81ecff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ec"/><stop offset="1" stop-color="#70aaff"/></linearGradient>
    <linearGradient id="prodA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#81ecff" stop-opacity="0.75"/><stop offset="1" stop-color="#1c1d1f"/></linearGradient>
    <linearGradient id="prodB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70aaff" stop-opacity="0.8"/><stop offset="1" stop-color="#1c1d1f"/></linearGradient>
    <linearGradient id="prodC" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00d4ec" stop-opacity="0.7"/><stop offset="1" stop-color="#232427"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0e0e0e"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- Marketplace window (back) -->
  <g transform="translate(90 90)">
    <rect width="640" height="560" rx="22" fill="#141517" stroke="#2a2b2e" stroke-width="2"/>
    <circle cx="30" cy="30" r="6" fill="#ff6b6b" fill-opacity="0.7"/><circle cx="50" cy="30" r="6" fill="#ffd166" fill-opacity="0.7"/><circle cx="70" cy="30" r="6" fill="#81ecff" fill-opacity="0.7"/>
    <rect x="190" y="18" width="260" height="24" rx="12" fill="#1c1d1f"/>
    <text x="320" y="35" fill="#adaaaa" font-size="12" text-anchor="middle">1pageshop.com/#shops</text>
    <line x1="0" y1="60" x2="640" y2="60" stroke="#2a2b2e" stroke-width="2"/>

    <text x="32" y="104" fill="#81ecff" font-size="24" font-weight="800">1PageShop</text>
    <text x="32" y="130" fill="#adaaaa" font-size="13">Browse shops across all 77 districts</text>
    <rect x="420" y="84" width="188" height="40" rx="12" fill="#81ecff"/>
    <text x="514" y="109" fill="#003840" font-size="14" font-weight="800" text-anchor="middle">Start Selling</text>

    <rect x="32" y="150" width="576" height="40" rx="12" fill="#1c1d1f" stroke="#2a2b2e"/>
    <circle cx="54" cy="170" r="7" fill="none" stroke="#adaaaa" stroke-width="2"/><line x1="59" y1="175" x2="65" y2="181" stroke="#adaaaa" stroke-width="2"/>
    <text x="76" y="175" fill="#adaaaa" font-size="14">Search shops…</text>

    <!-- Shop tiles: one per tenant -->
    <g font-size="12">
      <g transform="translate(32 212)">
        <rect width="180" height="150" rx="14" fill="#1c1d1f" stroke="#81ecff" stroke-opacity="0.45" stroke-width="2"/>
        <circle cx="36" cy="38" r="20" fill="#81ecff" fill-opacity="0.18"/><text x="36" y="44" fill="#81ecff" font-size="16" font-weight="800" text-anchor="middle">A</text>
        <text x="66" y="36" fill="#ffffff" font-weight="700">Anand's Crafts</text>
        <text x="66" y="54" fill="#adaaaa" font-size="11">Kathmandu</text>
        <rect x="16" y="76" width="70" height="56" rx="8" fill="url(#prodA)"/><rect x="94" y="76" width="70" height="56" rx="8" fill="url(#prodB)"/>
      </g>
      <g transform="translate(230 212)">
        <rect width="180" height="150" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <circle cx="36" cy="38" r="20" fill="#70aaff" fill-opacity="0.18"/><text x="36" y="44" fill="#70aaff" font-size="16" font-weight="800" text-anchor="middle">H</text>
        <text x="66" y="36" fill="#ffffff" font-weight="700">Himal Honey</text>
        <text x="66" y="54" fill="#adaaaa" font-size="11">Pokhara</text>
        <rect x="16" y="76" width="70" height="56" rx="8" fill="url(#prodC)"/><rect x="94" y="76" width="70" height="56" rx="8" fill="url(#prodA)"/>
      </g>
      <g transform="translate(428 212)">
        <rect width="180" height="150" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <circle cx="36" cy="38" r="20" fill="#00d4ec" fill-opacity="0.18"/><text x="36" y="44" fill="#00d4ec" font-size="16" font-weight="800" text-anchor="middle">D</text>
        <text x="66" y="36" fill="#ffffff" font-weight="700">Dhaka House</text>
        <text x="66" y="54" fill="#adaaaa" font-size="11">Palpa</text>
        <rect x="16" y="76" width="70" height="56" rx="8" fill="url(#prodB)"/><rect x="94" y="76" width="70" height="56" rx="8" fill="url(#prodC)"/>
      </g>
      <g transform="translate(32 380)" opacity="0.6">
        <rect width="180" height="150" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="16" y="76" width="148" height="56" rx="8" fill="url(#prodB)"/>
      </g>
      <g transform="translate(230 380)" opacity="0.6">
        <rect width="180" height="150" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="16" y="76" width="148" height="56" rx="8" fill="url(#prodA)"/>
      </g>
      <g transform="translate(428 380)" opacity="0.6">
        <rect width="180" height="150" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="16" y="76" width="148" height="56" rx="8" fill="url(#prodC)"/>
      </g>
    </g>
  </g>

  <!-- Phone: a single tenant's one-page shop -->
  <g transform="translate(700 70)">
    <rect width="320" height="610" rx="40" fill="#141517" stroke="#81ecff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="120" y="16" width="80" height="8" rx="4" fill="#2a2b2e"/>
    <rect x="20" y="40" width="280" height="110" rx="16" fill="url(#banner)"/>
    <text x="40" y="84" fill="#003840" font-size="20" font-weight="800">Anand's Crafts</text>
    <text x="40" y="106" fill="#003840" font-size="12" font-weight="600">Kathmandu · Live</text>
    <rect x="40" y="118" width="88" height="20" rx="10" fill="#0e0e0e" fill-opacity="0.25"/>
    <text x="84" y="132" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Made in Nepal</text>

    <g font-size="12">
      <g transform="translate(20 168)">
        <rect width="280" height="120" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="12" y="12" width="96" height="96" rx="10" fill="url(#prodA)"/>
        <text x="122" y="36" fill="#ffffff" font-size="14" font-weight="700">Handmade Dhaka Bag</text>
        <text x="122" y="58" fill="#adaaaa" text-decoration="line-through">NPR 1,200</text>
        <text x="192" y="58" fill="#81ecff" font-weight="800">NPR 850</text>
        <rect x="122" y="74" width="140" height="32" rx="10" fill="#81ecff"/>
        <text x="192" y="95" fill="#003840" font-weight="800" text-anchor="middle">Add to Cart</text>
      </g>
      <g transform="translate(20 302)">
        <rect width="280" height="120" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="12" y="12" width="96" height="96" rx="10" fill="url(#prodC)"/>
        <text x="122" y="36" fill="#ffffff" font-size="14" font-weight="700">Mountain Honey 500g</text>
        <text x="122" y="58" fill="#adaaaa" text-decoration="line-through">NPR 1,800</text>
        <text x="200" y="58" fill="#81ecff" font-weight="800">NPR 1,200</text>
        <rect x="122" y="74" width="140" height="32" rx="10" fill="#81ecff"/>
        <text x="192" y="95" fill="#003840" font-weight="800" text-anchor="middle">Add to Cart</text>
      </g>
      <g transform="translate(20 436)" opacity="0.6">
        <rect width="280" height="120" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="12" y="12" width="96" height="96" rx="10" fill="url(#prodB)"/>
      </g>
    </g>
  </g>

  <!-- Floating order toast -->
  <g transform="translate(560 560)">
    <rect width="250" height="72" rx="16" fill="#232427" stroke="#81ecff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="36" cy="36" r="18" fill="#81ecff" fill-opacity="0.15"/>
    <path d="M27 30h18l-2 11h-14z M30 30l2-6h8l2 6" fill="none" stroke="#81ecff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="66" y="32" fill="#ffffff" font-size="14" font-weight="800">New order from Pokhara</text>
    <text x="66" y="52" fill="#adaaaa" font-size="12">Seller dashboard · just now</text>
  </g>
</svg>
