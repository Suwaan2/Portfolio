<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#81ecff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#70aaff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0e0e0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#81ecff" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#81ecff"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="#0e0e0e"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- Terminal: MCP tool calls -->
  <g transform="translate(90 140)" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15">
    <rect width="440" height="440" rx="20" fill="#000000" stroke="#2a2b2e" stroke-width="2"/>
    <circle cx="28" cy="28" r="6" fill="#ff6b6b" fill-opacity="0.7"/><circle cx="48" cy="28" r="6" fill="#ffd166" fill-opacity="0.7"/><circle cx="68" cy="28" r="6" fill="#81ecff" fill-opacity="0.7"/>
    <text x="220" y="33" fill="#adaaaa" font-size="12" text-anchor="middle">trello-mcp · stdio</text>
    <line x1="0" y1="56" x2="440" y2="56" stroke="#2a2b2e" stroke-width="2"/>
    <text x="24" y="96" fill="#adaaaa">// AI assistant → MCP server</text>
    <text x="24" y="132"><tspan fill="#81ecff">›</tspan><tspan fill="#ffffff"> tools/call </tspan><tspan fill="#70aaff">get_boards</tspan></text>
    <text x="24" y="162" fill="#adaaaa">  ✓ 4 boards</text>
    <text x="24" y="198"><tspan fill="#81ecff">›</tspan><tspan fill="#ffffff"> tools/call </tspan><tspan fill="#70aaff">get_cards</tspan></text>
    <text x="24" y="228" fill="#adaaaa">  ✓ 12 cards in "Sprint"</text>
    <text x="24" y="264"><tspan fill="#81ecff">›</tspan><tspan fill="#ffffff"> tools/call </tspan><tspan fill="#70aaff">create_card</tspan></text>
    <text x="24" y="294" fill="#adaaaa">  ✓ "Ship portfolio v2"</text>
    <text x="24" y="330"><tspan fill="#81ecff">›</tspan><tspan fill="#ffffff"> tools/call </tspan><tspan fill="#70aaff">move_card</tspan></text>
    <text x="24" y="360" fill="#81ecff">  ✓ Doing → Done</text>
    <text x="24" y="400"><tspan fill="#81ecff">›</tspan><tspan fill="#ffffff"> </tspan></text>
    <rect x="44" y="386" width="10" height="18" fill="#81ecff"/>
    <rect x="300" y="390" width="116" height="28" rx="14" fill="#81ecff" fill-opacity="0.12"/>
    <text x="358" y="409" fill="#81ecff" font-size="12" font-weight="700" text-anchor="middle">zod-validated</text>
  </g>

  <!-- Arrow -->
  <path d="M548 360 C 590 360 600 360 640 360" fill="none" stroke="#81ecff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

  <!-- Trello-style board -->
  <g transform="translate(660 140)" font-size="13">
    <rect width="450" height="440" rx="20" fill="#141517" stroke="#2a2b2e" stroke-width="2"/>
    <text x="24" y="38" fill="#ffffff" font-size="16" font-weight="800">Sprint board</text>
    <rect x="360" y="20" width="66" height="26" rx="13" fill="#70aaff" fill-opacity="0.18"/>
    <text x="393" y="38" fill="#70aaff" font-size="12" font-weight="700" text-anchor="middle">Trello</text>

    <g transform="translate(18 64)">
      <rect width="130" height="356" rx="14" fill="#1c1d1f"/>
      <text x="14" y="28" fill="#adaaaa" font-weight="700">To do</text>
      <rect x="10" y="44" width="110" height="64" rx="10" fill="#232427"/><rect x="22" y="60" width="72" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.8"/><rect x="22" y="76" width="50" height="6" rx="3" fill="#adaaaa" fill-opacity="0.5"/><rect x="22" y="92" width="28" height="6" rx="3" fill="#ffd166"/>
      <rect x="10" y="118" width="110" height="64" rx="10" fill="#232427"/><rect x="22" y="134" width="82" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.8"/><rect x="22" y="150" width="40" height="6" rx="3" fill="#adaaaa" fill-opacity="0.5"/><rect x="22" y="166" width="28" height="6" rx="3" fill="#70aaff"/>
    </g>
    <g transform="translate(160 64)">
      <rect width="130" height="356" rx="14" fill="#1c1d1f"/>
      <text x="14" y="28" fill="#adaaaa" font-weight="700">Doing</text>
      <rect x="10" y="44" width="110" height="64" rx="10" fill="#232427"/><rect x="22" y="60" width="66" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.8"/><rect x="22" y="76" width="56" height="6" rx="3" fill="#adaaaa" fill-opacity="0.5"/><rect x="22" y="92" width="28" height="6" rx="3" fill="#70aaff"/>
      <rect x="10" y="118" width="110" height="64" rx="10" fill="none" stroke="#81ecff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 5"/>
    </g>
    <g transform="translate(302 64)">
      <rect width="130" height="356" rx="14" fill="#1c1d1f"/>
      <text x="14" y="28" fill="#adaaaa" font-weight="700">Done</text>
      <rect x="10" y="44" width="110" height="64" rx="10" fill="#232427" stroke="#81ecff" stroke-width="2"/>
      <rect x="22" y="60" width="78" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.9"/><rect x="22" y="76" width="46" height="6" rx="3" fill="#adaaaa" fill-opacity="0.5"/>
      <circle cx="104" cy="92" r="8" fill="#81ecff"/><path d="M100 92 l3 3 l5 -6" fill="none" stroke="#003840" stroke-width="2"/>
      <rect x="10" y="118" width="110" height="64" rx="10" fill="#232427"/><rect x="22" y="134" width="60" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.6"/><rect x="22" y="150" width="70" height="6" rx="3" fill="#adaaaa" fill-opacity="0.4"/>
      <rect x="10" y="192" width="110" height="64" rx="10" fill="#232427"/><rect x="22" y="208" width="74" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.6"/><rect x="22" y="224" width="44" height="6" rx="3" fill="#adaaaa" fill-opacity="0.4"/>
    </g>
  </g>
</svg>
