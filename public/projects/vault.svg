<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#81ecff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#70aaff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0e0e0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#81ecff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ec"/><stop offset="1" stop-color="#1c1d1f"/></linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70aaff"/><stop offset="1" stop-color="#1c1d1f"/></linearGradient>
    <linearGradient id="thumbC" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#81ecff" stop-opacity="0.7"/><stop offset="1" stop-color="#232427"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0e0e0e"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- App window -->
  <g transform="translate(150 110)">
    <rect width="900" height="560" rx="22" fill="#141517" stroke="#2a2b2e" stroke-width="2"/>
    <circle cx="30" cy="30" r="6" fill="#ff6b6b" fill-opacity="0.7"/><circle cx="50" cy="30" r="6" fill="#ffd166" fill-opacity="0.7"/><circle cx="70" cy="30" r="6" fill="#81ecff" fill-opacity="0.7"/>
    <rect x="300" y="18" width="300" height="24" rx="12" fill="#1c1d1f"/>
    <text x="450" y="35" fill="#adaaaa" font-size="12" text-anchor="middle">vault.app/library</text>
    <line x1="0" y1="60" x2="900" y2="60" stroke="#2a2b2e" stroke-width="2"/>

    <!-- Sidebar: source platforms -->
    <g transform="translate(24 84)">
      <text fill="#81ecff" font-size="22" font-weight="800">Vault</text>
      <g font-size="13" fill="#adaaaa" transform="translate(0 40)">
        <rect width="150" height="34" rx="10" fill="#81ecff" fill-opacity="0.12"/>
        <text x="14" y="22" fill="#81ecff" font-weight="700">All saves · 248</text>
        <circle cx="16" cy="66" r="7" fill="#e1306c"/><text x="34" y="71">Instagram</text>
        <circle cx="16" cy="102" r="7" fill="#25f4ee"/><text x="34" y="107">TikTok</text>
        <circle cx="16" cy="138" r="7" fill="#ff3b3b"/><text x="34" y="143">YouTube</text>
        <circle cx="16" cy="174" r="7" fill="#ffffff"/><text x="34" y="179">X</text>
        <circle cx="16" cy="210" r="7" fill="#1877f2"/><text x="34" y="215">Facebook</text>
      </g>
    </g>
    <line x1="196" y1="60" x2="196" y2="560" stroke="#2a2b2e" stroke-width="2"/>

    <!-- Search -->
    <rect x="220" y="80" width="420" height="40" rx="12" fill="#1c1d1f" stroke="#2a2b2e"/>
    <circle cx="242" cy="100" r="7" fill="none" stroke="#adaaaa" stroke-width="2"/><line x1="247" y1="105" x2="253" y2="111" stroke="#adaaaa" stroke-width="2"/>
    <text x="264" y="105" fill="#adaaaa" font-size="14">Search saves, tags, summaries…</text>
    <rect x="760" y="80" width="116" height="40" rx="12" fill="#81ecff"/>
    <text x="818" y="105" fill="#003840" font-size="14" font-weight="800" text-anchor="middle">+ Save link</text>

    <!-- Bookmark cards -->
    <g font-size="12">
      <g transform="translate(220 140)">
        <rect width="208" height="190" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="10" y="10" width="188" height="96" rx="10" fill="url(#thumbA)"/>
        <polygon points="96,46 96,72 118,59" fill="#0e0e0e" fill-opacity="0.65"/>
        <rect x="12" y="118" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.85"/>
        <rect x="12" y="134" width="110" height="7" rx="3.5" fill="#adaaaa" fill-opacity="0.5"/>
        <rect x="12" y="156" width="40" height="22" rx="11" fill="#81ecff" fill-opacity="0.15"/><text x="32" y="171" fill="#81ecff" font-weight="800" text-anchor="middle">AI</text>
        <rect x="58" y="156" width="64" height="22" rx="11" fill="#2a2b2e"/><text x="90" y="171" fill="#adaaaa" text-anchor="middle">#react</text>
      </g>
      <g transform="translate(444 140)">
        <rect width="208" height="190" rx="14" fill="#1c1d1f" stroke="#81ecff" stroke-opacity="0.45" stroke-width="2"/>
        <rect x="10" y="10" width="188" height="96" rx="10" fill="url(#thumbB)"/>
        <rect x="30" y="34" width="60" height="48" rx="6" fill="#0e0e0e" fill-opacity="0.45"/><rect x="100" y="34" width="76" height="20" rx="5" fill="#0e0e0e" fill-opacity="0.45"/>
        <rect x="12" y="118" width="170" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.85"/>
        <rect x="12" y="134" width="90" height="7" rx="3.5" fill="#adaaaa" fill-opacity="0.5"/>
        <rect x="12" y="156" width="40" height="22" rx="11" fill="#81ecff" fill-opacity="0.15"/><text x="32" y="171" fill="#81ecff" font-weight="800" text-anchor="middle">AI</text>
        <rect x="58" y="156" width="70" height="22" rx="11" fill="#2a2b2e"/><text x="93" y="171" fill="#adaaaa" text-anchor="middle">#design</text>
      </g>
      <g transform="translate(668 140)">
        <rect width="208" height="190" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="10" y="10" width="188" height="96" rx="10" fill="url(#thumbC)"/>
        <polygon points="96,46 96,72 118,59" fill="#0e0e0e" fill-opacity="0.65"/>
        <rect x="12" y="118" width="130" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.85"/>
        <rect x="12" y="134" width="120" height="7" rx="3.5" fill="#adaaaa" fill-opacity="0.5"/>
        <rect x="12" y="156" width="74" height="22" rx="11" fill="#2a2b2e"/><text x="49" y="171" fill="#adaaaa" text-anchor="middle">#nextjs</text>
      </g>
      <g transform="translate(220 346)" opacity="0.7">
        <rect width="208" height="190" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="10" y="10" width="188" height="96" rx="10" fill="url(#thumbB)"/>
      </g>
      <g transform="translate(668 346)" opacity="0.7">
        <rect width="208" height="190" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <rect x="10" y="10" width="188" height="96" rx="10" fill="url(#thumbA)"/>
      </g>
    </g>

    <!-- Floating AI summary -->
    <g transform="translate(404 300)">
      <rect width="300" height="150" rx="16" fill="#232427" stroke="#81ecff" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M24 30 l5 -12 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5z" fill="#81ecff"/>
      <text x="54" y="40" fill="#ffffff" font-size="15" font-weight="800">AI summary</text>
      <text x="276" y="40" fill="#adaaaa" font-size="11" text-anchor="end">GPT-4o-mini</text>
      <rect x="24" y="64" width="252" height="8" rx="4" fill="#adaaaa" fill-opacity="0.55"/>
      <rect x="24" y="82" width="230" height="8" rx="4" fill="#adaaaa" fill-opacity="0.55"/>
      <rect x="24" y="100" width="180" height="8" rx="4" fill="#adaaaa" fill-opacity="0.55"/>
      <g font-size="11" font-weight="700">
        <rect x="24" y="118" width="60" height="20" rx="10" fill="#70aaff" fill-opacity="0.18"/><text x="54" y="132" fill="#70aaff" text-anchor="middle">tutorial</text>
        <rect x="90" y="118" width="54" height="20" rx="10" fill="#70aaff" fill-opacity="0.18"/><text x="117" y="132" fill="#70aaff" text-anchor="middle">css</text>
      </g>
    </g>
  </g>
</svg>
