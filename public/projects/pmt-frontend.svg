<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#70aaff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#81ecff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0e0e0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#81ecff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#81ecff"/><stop offset="1" stop-color="#81ecff" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70aaff" stop-opacity="0.35"/><stop offset="1" stop-color="#70aaff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0e0e0e"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g transform="translate(150 110)">
    <rect width="900" height="560" rx="22" fill="#141517" stroke="#2a2b2e" stroke-width="2"/>

    <!-- Sidebar -->
    <rect width="190" height="560" rx="22" fill="#1c1d1f"/>
    <rect x="168" width="22" height="560" fill="#1c1d1f"/>
    <rect x="24" y="26" width="32" height="32" rx="9" fill="#81ecff"/>
    <text x="40" y="48" fill="#003840" font-size="15" font-weight="800" text-anchor="middle">P</text>
    <text x="66" y="48" fill="#ffffff" font-size="16" font-weight="800">PMT</text>
    <g font-size="13" fill="#adaaaa">
      <rect x="16" y="88" width="158" height="36" rx="10" fill="#81ecff" fill-opacity="0.12"/>
      <rect x="30" y="100" width="12" height="12" rx="3" fill="#81ecff"/><text x="52" y="111" fill="#81ecff" font-weight="700">Dashboard</text>
      <rect x="30" y="146" width="12" height="12" rx="3" fill="#adaaaa"/><text x="52" y="157">Projects</text>
      <rect x="30" y="186" width="12" height="12" rx="3" fill="#adaaaa"/><text x="52" y="197">Tasks</text>
      <rect x="30" y="226" width="12" height="12" rx="3" fill="#adaaaa"/><text x="52" y="237">Invoices</text>
      <rect x="30" y="266" width="12" height="12" rx="3" fill="#adaaaa"/><text x="52" y="277">Team</text>
      <rect x="30" y="306" width="12" height="12" rx="3" fill="#adaaaa"/><text x="52" y="317">Permissions</text>
    </g>
    <!-- Role switcher -->
    <g transform="translate(16 440)" font-size="11" font-weight="700">
      <text x="2" y="0" fill="#adaaaa" font-size="10" letter-spacing="1.5">VIEWING AS</text>
      <rect y="12" width="158" height="38" rx="10" fill="#232427" stroke="#2a2b2e"/>
      <circle cx="20" cy="31" r="9" fill="#70aaff"/>
      <text x="38" y="35" fill="#ffffff" font-size="13">Project Manager</text>
      <text x="2" y="76" fill="#adaaaa" font-weight="400">6 roles · 130 routes</text>
    </g>

    <!-- Header -->
    <text x="220" y="56" fill="#ffffff" font-size="22" font-weight="800">Good morning, Suan</text>
    <text x="220" y="80" fill="#adaaaa" font-size="13">Sprint 14 · 3 projects due this week</text>
    <rect x="770" y="36" width="106" height="36" rx="10" fill="#81ecff"/>
    <text x="823" y="59" fill="#003840" font-size="13" font-weight="800" text-anchor="middle">+ New task</text>

    <!-- KPI tiles -->
    <g transform="translate(220 104)">
      <rect width="208" height="96" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
      <text x="18" y="32" fill="#adaaaa" font-size="12">Active projects</text>
      <text x="18" y="72" fill="#ffffff" font-size="32" font-weight="800">24</text>
      <text x="190" y="72" fill="#81ecff" font-size="13" font-weight="700" text-anchor="end">+12%</text>
      <g transform="translate(224 0)">
        <rect width="208" height="96" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <text x="18" y="32" fill="#adaaaa" font-size="12">Tasks done</text>
        <text x="18" y="72" fill="#ffffff" font-size="32" font-weight="800">318</text>
        <text x="190" y="72" fill="#81ecff" font-size="13" font-weight="700" text-anchor="end">+8%</text>
      </g>
      <g transform="translate(448 0)">
        <rect width="208" height="96" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
        <text x="18" y="32" fill="#adaaaa" font-size="12">Billable hours</text>
        <text x="18" y="72" fill="#ffffff" font-size="32" font-weight="800">1.2k</text>
        <text x="190" y="72" fill="#70aaff" font-size="13" font-weight="700" text-anchor="end">on track</text>
      </g>
    </g>

    <!-- Chart -->
    <g transform="translate(220 218)">
      <rect width="400" height="230" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
      <text x="18" y="32" fill="#ffffff" font-size="14" font-weight="800">Velocity</text>
      <g fill="url(#bar)">
        <rect x="30" y="130" width="28" height="80" rx="6"/><rect x="78" y="100" width="28" height="110" rx="6"/>
        <rect x="126" y="140" width="28" height="70" rx="6"/><rect x="174" y="84" width="28" height="126" rx="6"/>
        <rect x="222" y="110" width="28" height="100" rx="6"/><rect x="270" y="64" width="28" height="146" rx="6"/>
        <rect x="318" y="92" width="28" height="118" rx="6"/>
      </g>
      <path d="M44 120 L92 96 L140 112 L188 70 L236 88 L284 52 L332 72" fill="none" stroke="#70aaff" stroke-width="3"/>
      <path d="M44 120 L92 96 L140 112 L188 70 L236 88 L284 52 L332 72 L332 210 L44 210Z" fill="url(#area)"/>
    </g>

    <!-- Task list -->
    <g transform="translate(636 218)" font-size="12">
      <rect width="240" height="230" rx="14" fill="#1c1d1f" stroke="#2a2b2e"/>
      <text x="18" y="32" fill="#ffffff" font-size="14" font-weight="800">My tasks</text>
      <g transform="translate(18 52)">
        <rect width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
        <rect x="150" y="-6" width="56" height="20" rx="10" fill="#81ecff" fill-opacity="0.15"/><text x="178" y="8" fill="#81ecff" font-weight="700" text-anchor="middle">Done</text>
      </g>
      <g transform="translate(18 92)">
        <rect width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
        <rect x="150" y="-6" width="56" height="20" rx="10" fill="#70aaff" fill-opacity="0.18"/><text x="178" y="8" fill="#70aaff" font-weight="700" text-anchor="middle">Review</text>
      </g>
      <g transform="translate(18 132)">
        <rect width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
        <rect x="150" y="-6" width="56" height="20" rx="10" fill="#ffd166" fill-opacity="0.15"/><text x="178" y="8" fill="#ffd166" font-weight="700" text-anchor="middle">Doing</text>
      </g>
      <g transform="translate(18 172)">
        <rect width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
        <rect x="150" y="-6" width="56" height="20" rx="10" fill="#2a2b2e"/><text x="178" y="8" fill="#adaaaa" font-weight="700" text-anchor="middle">To do</text>
      </g>
    </g>

    <!-- Permission chips -->
    <g transform="translate(220 470)" font-size="12" font-weight="700">
      <text x="0" y="0" fill="#adaaaa" font-size="10" letter-spacing="1.5" font-weight="400">ROLE PERMISSIONS</text>
      <rect y="14" width="76" height="26" rx="13" fill="#81ecff" fill-opacity="0.15"/><text x="38" y="31" fill="#81ecff" text-anchor="middle">Client</text>
      <rect x="86" y="14" width="56" height="26" rx="13" fill="#81ecff" fill-opacity="0.15"/><text x="114" y="31" fill="#81ecff" text-anchor="middle">PM</text>
      <rect x="152" y="14" width="80" height="26" rx="13" fill="#81ecff" fill-opacity="0.15"/><text x="192" y="31" fill="#81ecff" text-anchor="middle">OM / CEO</text>
      <rect x="242" y="14" width="88" height="26" rx="13" fill="#70aaff" fill-opacity="0.18"/><text x="286" y="31" fill="#70aaff" text-anchor="middle">Employee</text>
      <rect x="340" y="14" width="84" height="26" rx="13" fill="#70aaff" fill-opacity="0.18"/><text x="382" y="31" fill="#70aaff" text-anchor="middle">Accounts</text>
      <rect x="434" y="14" width="96" height="26" rx="13" fill="#2a2b2e"/><text x="482" y="31" fill="#ffffff" text-anchor="middle">SuperAdmin</text>
    </g>
  </g>
</svg>
